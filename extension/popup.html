<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>淘宝商家数据下载助手</title><link rel="stylesheet" href="popup.css"></head><body><main>
<header><div class="brand"><img class="brand-icon" src="icons/icon-48.png" width="36" height="36" alt=""><div><span class="eyebrow">本地运行 · 数据不外传</span><h1>淘宝商家数据下载助手</h1></div></div><label class="pause"><input id="paused" type="checkbox"> 暂停任务</label></header>
<section class="card"><h2>1. 店铺与日期</h2><label>店铺名称（用于文件夹命名）<input id="shopIdentity" placeholder="例如：我的淘宝店铺"></label><div class="grid two"><label>开始日期<input id="startDate" type="date"></label><label>结束日期<input id="endDate" type="date"></label></div><p class="hint">请先分别登录生意参谋和阿里妈妈。插件只点击官方页面的导出按钮。</p></section>
<section class="card"><h2>2. 单项下载 · 1.2.3</h2><div class="actions"><button data-run="store">店铺经营日报</button><button data-run="product">下载商品数据</button><button data-run="scene">营销场景报表</button><button data-run="item">商品推广报表</button><button data-run="content">内容推广明细</button><button data-run="taoke">淘宝联盟推广概览</button></div><p class="hint">淘宝联盟需登录商家账号，自动选择日期、按“分天＋按计划/活动类型”下载官方CSV，不是CPS订单明细。</p></section>
<section class="card"><h2>3. 历史补采</h2><p class="hint">按上方日期逐日重新下载所选报表，最多31天。不自动判断缺失日。淘宝联盟在新弹窗中选择日期后才提交；失败时不会自动重复导出。</p><div class="checks" id="backfillReports"><label><input type="checkbox" value="storeDaily" checked> 店铺经营日报</label><label><input type="checkbox" value="productDaily" checked> 商品数据</label><label><input type="checkbox" value="paidScene"> 营销场景</label><label><input type="checkbox" value="paidItem"> 商品推广</label><label><input type="checkbox" value="paidContent"> 内容推广</label><label><input id="backfillTaokeOverview" type="checkbox" value="taokeOverview"> 淘宝联盟推广概览</label></div><button id="runBackfill" class="primary">开始历史补采</button></section>
<section class="card"><h2>4. 每日定时</h2><label class="switch"><input id="scheduleEnabled" type="checkbox"> 开启每日自动下载</label><div class="grid two"><label>生意参谋时间<input id="scheduleTime" type="time" value="09:30"></label><label>推广报表时间<input id="afternoonScheduleTime" type="time" value="14:30"></label></div><div class="checks"><label><input id="scheduleIncludeStoreReport" type="checkbox" checked> 店铺经营日报</label><label><input id="scheduleIncludeProductReport" type="checkbox" checked> 商品数据</label><label><input id="scheduleIncludeSceneReport" type="checkbox"> 营销场景</label><label><input id="scheduleIncludeItemReport" type="checkbox"> 商品推广</label><label><input id="scheduleIncludeContentReport" type="checkbox"> 内容推广</label><label><input id="scheduleIncludeTaokeReport" type="checkbox"> 淘宝联盟推广概览</label></div><p class="hint">新安装默认不开定时，新增淘宝联盟默认不勾选。建议11点后下载昨日数据；登录或验证码由本人处理，不能核实日期时停止。</p><div class="actions"><button id="saveSchedule">保存定时设置</button><button id="runScheduleNow">立即按设置运行</button></div></section>
<section class="card"><h2>5. 运行状态</h2><p id="status" class="status">准备就绪</p><pre id="logs">暂无日志</pre></section>
</main><script src="popup.js"></script></body></html>
